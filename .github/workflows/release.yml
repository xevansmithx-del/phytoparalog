name: Release

on:
  push:
    tags: ["v0.1.0"]

permissions:
  contents: read

jobs:
  verify-build:
    name: Verify and build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SOURCE_DATE_EPOCH: "1786579200"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up locked dependency runner
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.20"
          enable-cache: false
      - name: Install complete release stack from frozen lock
        run: >-
          uv sync --frozen --extra dev --extra tooluniverse
          --group integrations --python python
      - name: Require tag and package versions to match
        run: |
          package_version=$(uv run --frozen --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Verify source
        run: |
          uv run --frozen --no-sync pre-commit run --all-files
          uv run --frozen --no-sync ruff check .
          uv run --frozen --no-sync ruff format --check .
          uv run --frozen --no-sync pytest
          uv run --frozen --no-sync python scripts/privacy_scan.py .
      - name: Build twice and require byte identity
        run: |
          uv run --frozen --no-sync python -m build --no-isolation --outdir dist-one
          uv run --frozen --no-sync python -m build --no-isolation --outdir dist-two
          uv run --frozen --no-sync python -m twine check dist-one/* dist-two/*
          cmp dist-one/phytoparalog-0.1.0-py3-none-any.whl dist-two/phytoparalog-0.1.0-py3-none-any.whl
          cmp dist-one/phytoparalog-0.1.0.tar.gz dist-two/phytoparalog-0.1.0.tar.gz
      - name: Extract, scan, and smoke-test
        run: |
          mkdir -p "$RUNNER_TEMP/wheel-tree" "$RUNNER_TEMP/sdist-tree"
          uv run --frozen --no-sync python -m zipfile -e \
            dist-one/phytoparalog-0.1.0-py3-none-any.whl "$RUNNER_TEMP/wheel-tree"
          uv run --frozen --no-sync python -m tarfile -e \
            dist-one/phytoparalog-0.1.0.tar.gz "$RUNNER_TEMP/sdist-tree"
          sdist_root="$RUNNER_TEMP/sdist-tree/phytoparalog-0.1.0"
          test -f "$sdist_root/README.md"
          test -f "$sdist_root/.pre-commit-config.yaml"
          test -f "$sdist_root/LICENSE"
          test -f "$sdist_root/uv.lock"
          test -f "$sdist_root/docs/architecture.md"
          test -f "$sdist_root/examples/synthetic/study.json"
          test -f "$sdist_root/scripts/privacy_scan.py"
          uv run --frozen --no-sync python scripts/privacy_scan.py "$RUNNER_TEMP/wheel-tree"
          uv run --frozen --no-sync python scripts/privacy_scan.py "$sdist_root"
          (
            cd "$sdist_root"
            uv sync --frozen --extra dev --extra tooluniverse \
              --group integrations --python python
            uv run --frozen --no-sync pytest
            uv run --frozen --no-sync phytoparalog validate \
              examples/synthetic/study.json
          )
          uv export --frozen --extra dev --extra tooluniverse --group integrations \
            --no-emit-project --output-file "$RUNNER_TEMP/wheel-requirements.txt"
          uv venv "$RUNNER_TEMP/release-wheel" --python python
          uv pip sync --python "$RUNNER_TEMP/release-wheel/bin/python" \
            "$RUNNER_TEMP/wheel-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/release-wheel/bin/python" \
            --no-deps dist-one/phytoparalog-0.1.0-py3-none-any.whl
          (
            cd "$sdist_root"
            "$RUNNER_TEMP/release-wheel/bin/phytoparalog" version
            "$RUNNER_TEMP/release-wheel/bin/phytoparalog" compile \
              examples/synthetic/study.json "$RUNNER_TEMP/release-capsule"
            "$RUNNER_TEMP/release-wheel/bin/phytoparalog" validate-capsule \
              "$RUNNER_TEMP/release-capsule" --study examples/synthetic/study.json
            "$RUNNER_TEMP/release-wheel/bin/python" -m pytest
            "$RUNNER_TEMP/release-wheel/bin/python" -c "from tooluniverse import ToolUniverse; names=['PhytoParalog_preflight','PhytoParalog_compile','PhytoParalog_validate_capsule']; tu=ToolUniverse(); tu.load_tools(include_tools=names); assert set(names) <= set(tu.all_tool_dict); assert tu.tools.PhytoParalog_validate_capsule(fixture_id='synthetic-minimal-v1')['data']['validation_mode']=='STUDY_RECOMPUTED'"
          )
          (cd dist-one && sha256sum phytoparalog-* > SHA256SUMS)
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phytoparalog-release-dist
          path: dist-one/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified GitHub release
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phytoparalog-release-dist
          path: release-dist
      - name: Reverify artifact hashes
        working-directory: release-dist
        run: sha256sum --check SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --draft --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" release-dist/* \
            --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --draft=false --latest
